name: Run API Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Run Cucumber API Tests
        run: >
          mvn clean test
          -Dcucumber.plugin="pretty,html:target/cucumber-report.html,json:target/cucumber-report.json"

      - name: Verify target directory
        if: always()
        run: |
          echo "==== TARGET DIRECTORY ===="
          ls -l target || echo "target not found"

      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-report.html

      - name: Upload Cucumber JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-json-report
          path: target/cucumber-report.json
