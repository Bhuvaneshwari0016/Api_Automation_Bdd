name: Run API Automation Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      - name: Verify Java & Maven
        run: |
          java -version
          mvn -version

      - name: Run Cucumber API Tests
        run: mvn clean test

      # (Optional but useful for debugging)
      - name: Verify target directory
        if: always()
        run: |
          echo "Listing target directory:"
          ls -R target || echo "No target directory found"

      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-reports/**/*.html

      - name: Upload Cucumber JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-json-report
          path: target/cucumber-reports/**/*.json
