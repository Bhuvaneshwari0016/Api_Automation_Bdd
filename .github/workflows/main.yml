name: Run API Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup Java 11
      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven

      # Step 3: Run Maven tests (this will execute Test.java)
      - name: Run Cucumber API Tests
        run: mvn clean test

      # Step 4: (Optional but recommended) Verify reports exist
      - name: List target directory
        if: always()
        run: |
          echo "Listing target directory:"
          ls -l target || echo "target directory not found"

      # Step 5: Upload Cucumber HTML report
      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-report.html

      # Step 6: Upload Cucumber JSON report
      - name: Upload Cucumber JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-json-report
          path: target/cucumber-report.json
