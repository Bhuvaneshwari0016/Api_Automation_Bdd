name: API Automation - Cucumber TestNG

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  api-tests:
    name: Run API Automation Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Setup Java 11
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: maven

      # Step 3: Verify setup
      - name: Verify Java and Maven versions
        run: |
          java -version
          mvn -version

      # Step 4: Run tests using TestRunner
      - name: Run Cucumber API Tests
        run: mvn clean test

      # Step 5: Upload Cucumber HTML report
      - name: Upload Cucumber HTML Report
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: cucumber-html-report
    path: target/cucumber-reports/*.html

 
 # Step 6: Upload Cucumber JSON report
       - name: Upload Cucumber JSON Report
  if: always()
  uses: actions/upload-artifact@v4
  with:
    name: cucumber-json-report
    path: target/cucumber-reports/*.json
